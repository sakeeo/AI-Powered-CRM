name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://crm_user:ci_password@localhost:5432/crm_dev?schema=public
  REDIS_URL: redis://localhost:6379
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: crm-files
  S3_ACCESS_KEY: ci_access_key
  S3_SECRET_KEY: ci_secret_key_123
  BETTER_AUTH_SECRET: ci_better_auth_secret_at_least_32_chars_long
  BETTER_AUTH_URL: http://localhost:3000
  ENCRYPTION_KEY: Y2lfZW5jcnlwdGlvbl9rZXlfMzJfYnl0ZXNfX19fX18=

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: crm_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm_user -d crm_dev" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run db:test:setup
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: crm_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm_user -d crm_dev" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:deploy
      - run: npm run build
      - run: npm run e2e:install
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crm:ci .
